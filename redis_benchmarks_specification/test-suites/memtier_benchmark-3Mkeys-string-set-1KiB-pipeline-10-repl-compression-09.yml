version: 0.4
name: memtier_benchmark-3Mkeys-string-set-1KiB-pipeline-10-repl-compression-09
description: |
  Steady-state replication benchmark with client-level replication compression
  enabled at zstd level 9 (repl-compression 9) on BOTH master and replica — the
  high-ratio/high-CPU point of the compression A/B/C triplet.

  Identical to memtier_benchmark-3Mkeys-string-set-1KiB-pipeline-10-repl-compression-03
  in every respect (dataset, client arguments, topology, build variants, exported
  metrics) except the compression level. Level 3 is zstd's default and the
  expected production setting; level 9 exists here to give the tradeoff curve a
  second point, so a regression that shows up only at higher levels (compressor
  latency, buffer growth, IO-thread stalls) is visible. Judge it against the
  -repl-compression-00 control, and against -03 for the marginal cost of raising
  the level.

  Expect the extra ratio over level 3 to be modest and the master CPU cost to be
  the headline delta; watch ReplicationFullSyncCountDuringBench for mid-run
  resyncs, which is the first symptom of the compressor not keeping up with the
  write rate.

  See the -03 sibling for the full rationale, including why the measured
  compression ratio is an upper bound with memtier-generated payloads.

  DEFECT FOUND BY THIS SPEC (2026-08-28, redis unstable @1c6fa3748): with the
  default `repl-rdb-channel yes` (dual-channel full sync), a nonzero
  repl-compression corrupts the master's compressor as soon as the RDB transfer
  overlaps a non-trivial replication stream. The master logs
  "zstd compress error: Src size is incorrect", destroys the replica's
  compression state, the replica aborts the rdb-channel sync and retries
  forever — master_link_status never reaches "up". Measured on redis-gnr at 3M
  x 1KiB keys: repl-compression 0 syncs in 22.1s on the first attempt, while
  repl-compression 3 failed 10/10 attempts with replica dbsize stuck at 0. It
  reproduces at 3M keys and slips through at 500k, so it is dataset-size
  dependent. `repl-rdb-channel no` syncs normally (22.6s), so this spec pins it
  off in order to measure the compressor at all. Restore the default here once
  the dual-channel interaction is fixed.
  OFFERED RATE IS FIXED (--rate-limiting 15000 x 20 connections = 300k ops/s).
  This is not a throughput test and must not be run open-loop. Measured on
  redis-gnr: unthrottled (-c 25 -t 8, pipeline 10) the master reaches ~820k
  SET/s, which no single replica can apply -- the master offloads socket work to
  its io-threads across 200 connections while the replica must read, parse AND
  apply the whole stream on its single main thread. The replica falls behind,
  overruns client-output-buffer-limit, gets killed and full-resyncs: 20 resyncs
  inside a 180s window, replication output collapsing to ~33 MB/s of thrash
  instead of ~860 MB/s of stream. Every KPI is then meaningless (master CPU is
  dominated by 20 BGSAVEs, replica CPU *falls* as the level rises because the
  replica does less useful work). Rate-limited to 300k ops/s the replica keeps up
  exactly: 0 resyncs and 0 byte lag, verified up to 500k ops/s.

  Because the rate is fixed, Ops/sec is set by the client and is NOT a signal
  here -- it should read ~300k in every arm, and a shortfall means the arm could
  not keep up and should be discarded. The per-op cost of the compress/decompress
  wrappers shows up in the latency percentiles and in MasterCPUSeconds /
  ReplicaCPUSecondsPerReplica per identical logical byte, which is the whole point
  of pinning the rate: all three arms push the same logical bytes through the
  replication path, so CPU and bytes-on-wire are directly comparable.
dbconfig:
  # Preload BEFORE replicas spin up so the dataset transfers via one initial
  # full sync and the measured phase is pure steady-state write traffic.
  preload_before_replica: true
  configuration-parameters:
    save: '""'
    maxmemory-policy: noeviction
    rdbcompression: 'no'
    repl-backlog-size: 256mb
    client-output-buffer-limit: 'replica 2048mb 2048mb 120'
    # Immutable config: it is applied as a startup argument to the primary and to
    # every replica (the coordinator passes the same configuration-parameters to
    # both), which is what the master's level-equality check requires.
    repl-compression: '9'
    # Pinned off: the default (yes) is incompatible with a nonzero
    # repl-compression on this build -- see DEFECT FOUND BY THIS SPEC above.
    repl-rdb-channel: 'no'
  check:
    keyspacelen: 3000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --data-size 1024 -R --ratio 1:0 -n allkeys --pipeline 50 --key-maximum
      3000000 --key-pattern P:P --key-minimum 1 --hide-histogram -t 8 -c 25
  resources:
    requests:
      memory: 6g
  dataset_name: 3Mkeys-string-1KiB-size-randomdata
  dataset_description: |
    3 million string keys, each with a 1024-byte random (incompressible)
    value (~3 GB dataset). Small enough that the initial full sync is short and
    the run is dominated by the steady-state stream, large enough that
    uniform-random overwrites keep touching cold keys.
tested-commands:
- set
redis-topologies:
- oss-standalone-01-replicas-04-io-threads
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-compression
- gcc:15.2.0-arm64-debian-bookworm-compression
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: '"--data-size" "1024" -R --command "SET __key__ __data__" --command-key-pattern
    R --key-minimum 1 --key-maximum 3000000 --distinct-client-seed --pipeline 10
    -c 5 -t 4 --rate-limiting 15000 --test-time 180 --hide-histogram'
  resources:
    requests:
      cpus: '4'
      memory: 1g
tested-groups:
- string
priority: 17
exporter:
  redistimeseries:
    timemetric: $."ALL STATS".Runtime."Start time"
    metrics:
    - $."ALL STATS".Totals."ReplicationFullSyncSeconds"
    - $."ALL STATS".Totals."ReplicationFullSyncCountDuringBench"
    - $."ALL STATS".Totals."MasterReplicationBytesSent"
    - $."ALL STATS".Totals."MasterReplicationBytesUncompressed"
    - $."ALL STATS".Totals."ReplicaReplicationBytesReceived"
    - $."ALL STATS".Totals."ReplicaReplicationBytesDecompressed"
    - $."ALL STATS".Totals."ReplicationCompressionRatio"
    - $."ALL STATS".Totals."MasterCPUSeconds"
    - $."ALL STATS".Totals."MasterCPUUtilizationPct"
    - $."ALL STATS".Totals."ReplicaCPUSecondsPerReplica"
    - $."ALL STATS".Totals."ReplicaCPUUtilizationPct"
